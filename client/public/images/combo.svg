<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCombo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <linearGradient id="bottleGradC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="25%" stop-color="#171717"/>
      <stop offset="70%" stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="frostedGlassS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F7F5F0" stop-opacity="0.90"/>
      <stop offset="80%" stop-color="#EFEBE4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.90"/>
    </linearGradient>
    <filter id="shadowCombo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#171717" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="800" fill="url(#bgGradCombo)"/>
  <ellipse cx="450" cy="720" rx="280" ry="30" fill="#000000" opacity="0.1" filter="blur(12px)"/>

  <!-- Left: Black Cleanser Bottle -->
  <g filter="url(#shadowCombo)" transform="translate(40, 40)">
    <!-- Pump -->
    <path d="M260 180 H350 C365 180 375 190 375 205 V220 H260 Z" fill="#FFFFFF"/>
    <path d="M350 190 L400 195 V210 L350 205 Z" fill="#E0E0E0"/>
    <rect x="302" y="220" width="36" height="45" fill="#E5E5E5" rx="2"/>
    <rect x="290" y="265" width="60" height="25" fill="#CCCCCC" rx="3"/>

    <!-- Black Body -->
    <rect x="210" y="290" width="220" height="390" rx="28" fill="url(#bottleGradC)"/>
    <!-- Label -->
    <rect x="230" y="340" width="180" height="290" fill="#FAFAFA" rx="4"/>
    <text x="320" y="390" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" letter-spacing="4" fill="#171717">MILIVA</text>
    <line x1="260" y1="410" x2="380" y2="410" stroke="#171717" stroke-width="1.5"/>
    <text x="320" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" letter-spacing="2" fill="#171717">FACE CLEANSER</text>
    <text x="320" y="465" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="10" letter-spacing="1" fill="#6B6B6B">ACNE &amp; BRIGHTENING</text>
  </g>

  <!-- Right: Serum Frosted Bottle -->
  <g filter="url(#shadowCombo)" transform="translate(180, 70)">
    <!-- Black Pump -->
    <path d="M350 200 H420 C435 200 445 210 445 225 V240 H350 Z" fill="#171717"/>
    <rect x="382" y="240" width="36" height="40" fill="#171717" rx="2"/>
    <rect x="365" y="280" width="70" height="30" fill="#242424" rx="3"/>

    <!-- Frosted Body -->
    <rect x="300" y="310" width="200" height="350" rx="24" fill="url(#frostedGlassS)" stroke="#E2DDD5" stroke-width="2"/>
    <rect x="320" y="365" width="160" height="240" fill="#FFFFFF" rx="2" stroke="#EAE6DF"/>
    <text x="400" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="#171717">MILIVA</text>
    <line x1="345" y1="432" x2="455" y2="432" stroke="#171717" stroke-width="1.5"/>
    <text x="400" y="460" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#171717">FACE SERUM</text>
    <text x="400" y="482" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="9" letter-spacing="1" fill="#6B6B6B">CLEAR &amp; EVEN TONE</text>
  </g>

  <!-- Combo Badge Overlay -->
  <g transform="translate(370, 680)">
    <rect x="0" y="0" width="160" height="36" fill="#171717" rx="4"/>
    <text x="80" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" letter-spacing="2" fill="#FFFFFF">ACNE CARE COMBO</text>
  </g>
</svg>
